spring.application.name=matching-service
server.port=8084


# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092


# Kafka Consumer
spring.kafka.consumer.group-id=ride-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rideshare.rideservice.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.rideshare.rideservice.event.RideMatchedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Location Service
location.service.url=http://localhost:8082


# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# Logging
logging.level.com.rideshare=INFO
logging.level.org.springframework.web=INFO